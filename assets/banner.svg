<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D1322" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.5" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#60A5FA" />
      <stop offset="70%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Animated Scanner Beam Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#020617" flood-opacity="0.8" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1.5" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <style>
      /* Dynamic Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }

      @keyframes scanMove {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { transform: translateY(340px); opacity: 0; }
      }

      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes floatPill {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      @keyframes floatPillReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }

      .glow-orb-left {
        transform-origin: 200px 180px;
        animation: pulseGlow 7s ease-in-out infinite;
      }

      .glow-orb-right {
        transform-origin: 1000px 200px;
        animation: pulseGlow 6s ease-in-out infinite reverse;
      }

      .scanner-line {
        animation: scanMove 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .flow-stream {
        stroke-dasharray: 12 8;
        animation: dashFlow 2.5s linear infinite;
      }

      .float-card-1 {
        animation: floatPill 5s ease-in-out infinite;
      }

      .float-card-2 {
        animation: floatPillReverse 6s ease-in-out infinite;
      }

      .float-card-3 {
        animation: floatPill 5.5s ease-in-out infinite 1s;
      }

      /* Typography */
      .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace; }
      .font-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Dynamic Animated Ambient Glow Orbs (Background Layer) -->
  <g id="dynamic-ambient-background">
    <!-- Left Cyan Orb -->
    <circle class="glow-orb-left" cx="200" cy="180" r="160" fill="#0284C7" fill-opacity="0.3" filter="url(#glow)" />
    <!-- Right Purple Orb -->
    <circle class="glow-orb-right" cx="1000" cy="200" r="180" fill="#7C3AED" fill-opacity="0.25" filter="url(#glow)" />
    <!-- Center Violet Accent -->
    <circle cx="600" cy="90" r="120" fill="#4F46E5" fill-opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Animated Data Flow Streams (Behind Foreground) -->
  <g id="dynamic-flow-streams" opacity="0.45">
    <path class="flow-stream" d="M 0 90 Q 300 130 600 70 T 1200 100" fill="none" stroke="#38BDF8" stroke-width="1.8" />
    <path class="flow-stream" d="M 0 290 Q 350 250 700 310 T 1200 280" fill="none" stroke="#818CF8" stroke-width="1.8" />
  </g>

  <!-- Decorative Animated Floating Badges (Side Margins) -->
  <g id="dynamic-side-badges">
    <!-- Left Side Badge: Vision Engine -->
    <g class="float-card-1" transform="translate(45, 120)">
      <rect width="120" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="5" fill="#38BDF8" />
      <text x="36" y="26" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8">OpenCV</text>
    </g>
    <!-- Left Side Lower Badge: PyAutoGUI -->
    <g class="float-card-2" transform="translate(35, 210)">
      <rect width="135" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="5" fill="#818CF8" />
      <text x="36" y="26" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8">PyAutoGUI</text>
    </g>

    <!-- Right Side Badge: Edge Browser -->
    <g class="float-card-2" transform="translate(1025, 120)">
      <rect width="135" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="24" cy="21" r="5" fill="#38BDF8" />
      <text x="38" y="26" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8">MS Edge Focus</text>
    </g>
    <!-- Right Side Lower Badge: PyPI Release -->
    <g class="float-card-3" transform="translate(1040, 210)">
      <rect width="120" height="42" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#A855F7" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="5" fill="#A855F7" />
      <text x="36" y="26" class="font-mono" font-size="11" font-weight="600" fill="#94A3B8">PyPI CLI</text>
    </g>
  </g>

  <!-- Animated Scanner Laser (Representing Computer Vision Scanning) -->
  <g id="scanner-laser" opacity="0.7">
    <rect class="scanner-line" x="220" y="20" width="760" height="2" fill="url(#scanBeam)" />
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND LAYER: Solid Readability Backdrop & Content  -->
  <!-- ======================================================== -->
  <g id="foreground-container" filter="url(#cardShadow)">
    <!-- Central Glass Backdrop Plate: Guarantees 100% Foreground Contrast -->
    <rect x="200" y="38" width="800" height="304" rx="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Corner Target Crosshairs (Vision Detection Motif) -->
    <path d="M 215 55 L 215 48 L 222 48" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M 985 55 L 985 48 L 978 48" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M 215 325 L 215 332 L 222 332" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    <path d="M 985 325 L 985 332 L 978 332" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

    <!-- Top Badge / Pill -->
    <g transform="translate(460, 62)">
      <rect width="280" height="28" rx="14" fill="url(#badgeGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
      <text x="140" y="19" class="font-sans" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">
        ROBOTIC PROCESS AUTOMATION
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="146" class="font-sans" font-size="48" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="2.5">
      FILE-UPLOAD-RPA
    </text>

    <!-- Subtitle -->
    <text x="600" y="184" class="font-sans" font-size="16.5" font-weight="500" fill="#CBD5E1" text-anchor="middle" letter-spacing="0.4">
      Vision-Based Desktop Upload Automation • PyAutoGUI • Computer Vision
    </text>

    <!-- Terminal Command Badge -->
    <g transform="translate(415, 212)">
      <rect width="370" height="40" rx="8" fill="#040814" stroke="#1E293B" stroke-width="1.2" />
      <circle cx="20" cy="20" r="4" fill="#EF4444" />
      <circle cx="34" cy="20" r="4" fill="#F59E0B" />
      <circle cx="48" cy="20" r="4" fill="#10B981" />
      <text x="75" y="25" class="font-mono" font-size="13.5" font-weight="600" fill="#38BDF8">$</text>
      <text x="94" y="25" class="font-mono" font-size="13.5" font-weight="600" fill="#F8FAFC">pip install file-upload-rpa</text>
    </g>

    <!-- Highlights Features Badges Row -->
    <g transform="translate(245, 280)">
      <!-- Feature 1: Multi-Step Vision -->
      <g transform="translate(0, 0)">
        <rect width="165" height="30" rx="15" fill="#0B132B" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="19" class="font-sans" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="middle">
          🔍 Multi-Step Vision
        </text>
      </g>
      <!-- Feature 2: Arbitrary Buttons -->
      <g transform="translate(180, 0)">
        <rect width="165" height="30" rx="15" fill="#0B132B" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="19" class="font-sans" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="middle">
          ⚡ Arbitrary Sequences
        </text>
      </g>
      <!-- Feature 3: Edge Auto-Focus -->
      <g transform="translate(360, 0)">
        <rect width="165" height="30" rx="15" fill="#0B132B" stroke="#334155" stroke-width="1" />
        <text x="82.5" y="19" class="font-sans" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="middle">
          🖥️ Edge Auto-Focus
        </text>
      </g>
      <!-- Feature 4: CLI & Library -->
      <g transform="translate(540, 0)">
        <rect width="170" height="30" rx="15" fill="#0B132B" stroke="#334155" stroke-width="1" />
        <text x="85" y="19" class="font-sans" font-size="11.5" font-weight="600" fill="#94A3B8" text-anchor="middle">
          📦 CLI &amp; Python Library
        </text>
      </g>
    </g>
  </g>
</svg>
